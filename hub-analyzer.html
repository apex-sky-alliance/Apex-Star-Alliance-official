<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hub Analyzer</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:50px;
}
button{
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>Apex Sky Alliance Hub Analyzer</h1>

<select id="airport">
    <option>Doha</option>
    <option>Dubai</option>
    <option>Tokyo</option>
    <option>Singapore</option>
</select>

<br><br>

<button onclick="analyze()">
診断
</button>

<h2 id="result"></h2>

<script>
function analyze() {

    const airport =
        document.getElementById("airport").value;

    let result = "";

    if (airport === "Doha") {
        result = "Sランク ⭐<br>世界最高レベルの乗継ハブ";
    }

    if (airport === "Dubai") {
        result = "Sランク ⭐<br>超巨大国際ハブ";
    }

    if (airport === "Tokyo") {
        result = "Aランク ⭐<br>需要は大きいが中継向きではない";
    }

    if (airport === "Singapore") {
        result = "Sランク ⭐<br>東南アジア最強クラス";
    }

    document.getElementById("result").innerHTML =
        result;
}
</script>

</body>
</html>
