});

function analyze(){

const airport =
airports[
document.getElementById("airportSelect").value
];

const total = Math.round(
(
airport.geography +
airport.network +
airport.transit +
airport.facilities
) / 4
);

let rank;
let description;

if(total >= 90){
rank = "S";
description = "Global Mega Hub";
}
else if(total >= 80){
rank = "A";
description = "International Hub";
}
else if(total >= 70){
rank = "B";
description = "Major Regional Hub";
}
else if(total >= 60){
rank = "C";
description = "Regional Hub";
}
else{
rank = "D";
description = "Local Gateway";
}

document.getElementById("result").innerHTML = `
