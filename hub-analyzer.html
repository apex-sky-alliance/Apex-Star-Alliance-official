<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apex Sky Alliance Hub Analyzer</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#FFD700;
}

select,
button{
    padding:10px;
    font-size:16px;
    margin:10px;
}

button{
    cursor:pointer;
}

#result{
    max-width:700px;
    margin:20px auto;
    padding:20px;
    border:2px solid #FFD700;
    border-radius:12px;
    background:#1e293b;
}

.rank{
    font-size:32px;
    font-weight:bold;
    color:#FFD700;
}

</style>
</head>

<body>

<h1>Apex Sky Alliance Hub Analyzer</h1>

<select id="airportSelect"></select>

<br>

<button onclick="analyze()">
Analyze Hub
</button>

<div id="result">
Select an airport and click Analyze Hub.
</div>

<script>

const airports = [

{
country:"Japan",
airport:"Tokyo International Airport (Haneda)",
code:"HND",
geography:88,
network:95,
transit:85,
facilities:97
},

{
country:"South Korea",
airport:"Incheon International Airport",
code:"ICN",
geography:92,
network:93,
transit:95,
facilities:96
},

{
country:"Qatar",
airport:"Hamad International Airport",
code:"DOH",
geography:99,
network:95,
transit:100,
facilities:99
},

{
country:"United Arab Emirates",
airport:"Dubai International Airport",
code:"DXB",
geography:99,
network:99,
transit:99,
facilities:97
}

];

const select = document.getElementById("airportSelect");

airports.forEach((airport, index) => {

    const option = document.createElement("option");

    option.value = index;

    option.textContent =
        `${airport.country} - ${airport.airport} (${airport.code})`;

    select.appendChild(option);

});

function analyze() {

    const index =
        document.getElementById("airportSelect").value;

    const airport =
        airports[index];

    const total = Math.round(
        (
            airport.geography +
            airport.network +
            airport.transit +
            airport.facilities
        ) / 4
    );

    let rank = "";
    let description = "";

    if(total >= 90){
        rank = "S";
        description = "Global Mega Hub";
    }
    else if(total >= 80){
        rank = "A";
        description = "International Hub";
    }
    else if(total >= 70){
        rank = "B";
        description = "Major Regional Hub";
    }
    else if(total >= 60){
        rank = "C";
        description = "Regional Hub";
    }
    else{
        rank = "D";
        description = "Local Gateway";
    }

    document.getElementById("result").innerHTML = `

        <h2>${airport.airport}</h2>

        <p><strong>Country:</strong> ${airport.country}</p>

        <p><strong>IATA Code:</strong> ${airport.code}</p>

        <h3>Overall Score</h3>

        <p>${total}/100</p>

        <div class="rank">${rank}</div>

        <p>${description}</p>

        <hr>

        <p><strong>Geographic Advantage:</strong> ${airport.geography}</p>

        <p><strong>International Network:</strong> ${airport.network}</p>

        <p><strong>Transfer Connectivity:</strong> ${airport.transit}</p>

        <p><strong>Airport Facilities:</strong> ${airport.facilities}</p>

    `;

}

</script>

</body>
</html>
